exclude: ^testdata/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^tests/data/

  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: uv run --no-sync isort
        language: system
        types: [python]
      - id: pyink
        name: pyink
        entry: uv run --no-sync pyink
        language: system
        types: [python]
        exclude: ^tests/data/
      - id: pylint
        name: pylint
        entry: uv run --no-sync pylint
        language: system
        types: [python]
        files: ^(src|tests)/
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy
        language: system
        types: [python]
        pass_filenames: false
