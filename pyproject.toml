[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[project]
name = "lutils"
version = "1.1.0"
description = "A Python library for managing and post-processing OpenFOAM cases."
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-2.1-only"
license-files = ["LICENSE"]
keywords = [
    "OpenFOAM",
    "OpenHFDIB-RANS",
    "CFD",
    "post-processing",
]
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.0",
    "polars>=1.41.2",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/vecerniv/lutils"
Documentation = "https://vecerniv.github.io/lutils"
Issues = "https://github.com/vecerniv/lutils/issues"

[dependency-groups]
dev = [
    "isort>=9.0.2",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pyink>=26.5.1",
    "pylint>=4.1.4",
    "types-pyyaml",
    { include-group = "test" }
]
test = [
    "pytest>=9.2.0",
    "pytest-cov",
]
docs = [
    "shibuya",
    "sphinx",
]

[tool.pyink]
line-length = 80
target-version = ["py312"]
pyink-indentation = 4
pyink-use-majority-quotes = false

[tool.isort]
profile = "google"
line_length = 80
src_paths = ["src", "tests"]
known_first_party = ["lutils"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["lutils"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
